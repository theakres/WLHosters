rap}.notice{margin-bottom:0.875rem;padding:0.625rem 0.875rem;background:var(--notice-bg);border:1px solid var(--notice-bd);border-radius:var(--radius);color:var(--notice-ink);font-size:0.875rem}.notice code{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:0.9em}.panel{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:0.9375rem}caption{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}thead th{text-align:left;font-size:0.75rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--faint);padding:0.875rem 1rem 0.625rem;border-bottom:1px solid var(--hairline)}tbody td{padding:0.625rem 1rem;border-bottom:1px solid var(--hairline)}tbody tr:last-child td{border-bottom:none}tbody tr{transition:background-color 150ms cubic-bezier(0.22,1,0.36,1)}tbody tr:hover{background:var(--row-hover)}th:first-child,td:first-child{padding-left:1.25rem;width:5.5rem}th:nth-child(2),td:nth-child(2){width:auto;white-space:normal;overflow-wrap:break-word;word-break:normal;hyphens:auto}th:last-child,td:last-child{padding-right:1.25rem;padding-left:1rem;text-align:center;width:8.5rem;white-space:nowrap}.asn{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:0.875rem;font-variant-numeric:tabular-nums;color:var(--muted)}.name{font-weight:500}.bgp,.tg{display:inline-flex;align-items:center;gap:0.3rem;font-size:0.875rem;font-weight:500;color:var(--accent-ink);text-decoration:none;background:var(--accent-bg);border-radius:999px;padding:0.2rem 0.7rem;transition:background-color 150ms cubic-bezier(0.22,1,0.36,1)}.bgp:hover,.tg:hover{background:var(--accent-bg-hover)}.bgp:active,.tg:active{background:var(--accent-bg-active)}.bgp:focus-visible,.tg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.bgp svg,.tg svg{flex:none}.tg{gap:0.4rem;padding:0.45rem 0.9rem}@media (pointer:coarse){.bgp{padding:0.4rem 0.85rem}}.state{padding:2.5rem 1.25rem;text-align:center;color:var(--muted);font-size:0.9375rem}.state code{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:0.85em}.state-hint{display:inline-block;margin-top:0.375rem;font-size:0.875rem;color:var(--faint)}.skeleton td span{display:inline-block;height:0.875rem;border-radius:999px;background:var(--hairline);animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:0.45}}@media (max-width:560px){.wrap{padding:2rem 0.875rem 3rem}.masthead{flex-direction:column;align-items:stretch}.masthead-inner{width:100%}.h1-desktop{display:none}.h1-mobile{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0.75rem;width:100%}.h1-lines{min-width:0}.tg-inline{justify-self:end}.actions{display:none}.controls{flex-wrap:wrap;gap:0.625rem}.search{max-width:none;flex-basis:100%}.count{margin-left:0.25rem}table{font-size:0.875rem;table-layout:auto}th:first-child,td:first-child{padding-left:0.875rem;width:4rem}th:nth-child(2),td:nth-child(2){width:auto}th:last-child,td:last-child{padding-right:0.875rem;padding-left:0.5rem;width:6rem}thead th,tbody td{padding-left:0.625rem;padding-right:0.625rem}.bgp{padding:0.2rem 0.6rem;font-size:0.8125rem;white-space:normal;text-align:center;line-height:1.3}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none !important;animation:none !important}}</style></head><body><div class="wrap"><header><div class="masthead"><div class="masthead-inner"><h1 class="h1-desktop">Хостеры с белыми IP</h1><div class="h1-mobile"><div class="h1-lines"><div class="h1-line">Хостеры</div><div class="h1-line">с белыми IP</div></div><a class="tg tg-inline" href="tg://resolve?domain=akresik" rel="noopener" title="Написать автору в Telegram"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M12.8 1.2 8.8 12.6 6.5 7.5 1.4 5.2 12.8 1.2Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M12.8 1.2 6.5 7.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
Автор
</a></div></div><div class="actions"><a class="tg" href="tg://resolve?domain=akresik" rel="noopener" title="Написать автору в Telegram"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M12.8 1.2 8.8 12.6 6.5 7.5 1.4 5.2 12.8 1.2Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M12.8 1.2 6.5 7.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
Автор
</a></div></div><p>Список может быть неполным. Если вы знаете других хостинг-провайдеров, которых нет в этом списке, но которые имеют белые IP-адреса, просьба сообщить об этом автору.</p></header><div class="controls"><div class="search"><svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.75" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L13.5 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><label for="q" class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Поиск</label><input id="q" type="search" placeholder="Название или ASN" autocomplete="off"></div><div class="count" id="count" aria-live="polite"></div></div><noscript><div class="notice">Для отображения списка включите JavaScript.</div></noscript><div class="panel"><table><caption>Хостеры с белыми IP от РКН</caption><thead><tr><th scope="col">ASN</th><th scope="col">Название</th><th scope="col">bgp.tools</th></tr></thead><tbody id="rows"><tr class="skeleton"><td><span style="width:3.5rem"></span></td><td><span style="width:6rem"></span></td><td><span style="width:4rem"></span></td></tr><tr class="skeleton"><td><span style="width:3rem"></span></td><td><span style="width:5rem"></span></td><td><span style="width:4rem"></span></td></tr><tr class="skeleton"><td><span style="width:3.75rem"></span></td><td><span style="width:7rem"></span></td><td><span style="width:4rem"></span></td></tr></tbody></table></div></div><script>(function () {
var tbody  = document.getElementById('rows');
var countEl = document.getElementById('count');
var input  = document.getElementById('q');
var all = [];
var failed = false;
function parse(text) {
var out = [];
text.split(/\r?\n/).forEach(function (line) {
line = line.trim();
if (!line) return;
var m = line.match(/^(\d+):(.+)$/);
if (m) out.push({ asn: m[1], name: m[2].trim() });
});
out.sort(function (a, b) {
return a.name.localeCompare(b.name, ['ru', 'en'], { sensitivity: 'base' });
});
return out;
}
function plural(n) {
var m10 = n % 10, m100 = n % 100;
if (m10 === 1 && m100 !== 11) return 'хостер';
if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'хостера';
return 'хостеров';
}
function stateRow(html) {
var tr = document.createElement('tr');
var td = document.createElement('td');
td.colSpan = 3;
td.className = 'state';
td.innerHTML = html;
tr.appendChild(td);
return tr;
}
function render(list, query) {
tbody.textContent = '';
if (all.length === 0) {
tbody.appendChild(stateRow('Файл <code>hosters.txt</code> пуст. Добавьте строку в формате <code>47764:VK</code>.'));
countEl.textContent = '';
return;
}
if (list.length === 0) {
var td = stateRow('');
td.firstChild.textContent = 'Ничего не найдено по запросу «' + query + '»';
tbody.appendChild(td);
countEl.textContent = '0 из ' + all.length;
return;
}
list.forEach(function (h) {
var tr = document.createElement('tr');
var tdAsn = document.createElement('td');
tdAsn.className = 'asn';
tdAsn.textContent = h.asn;
var tdName = document.createElement('td');
tdName.className = 'name';
tdName.textContent = h.name;
var tdLink = document.createElement('td');
var a = document.createElement('a');
a.className = 'bgp';
a.href = 'https://bgp.tools/as/' + h.asn;
a.target = '_blank';
a.rel = 'noopener';
a.innerHTML = 'Перейти <svg width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3.5 8.5L8.5 3.5M8.5 3.5H4.5M8.5 3.5V7.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
a.setAttribute('aria-label', h.name + ' на bgp.tools');
tdLink.appendChild(a);
tr.appendChild(tdAsn);
tr.appendChild(tdName);
tr.appendChild(tdLink);
tbody.appendChild(tr);
});
countEl.textContent = query
? 'Хостеров: ' + list.length + ' из ' + all.length
: 'Хостеров: ' + all.length;
}
function applyFilter() {
if (failed) return;
var q = input.value.trim().toLowerCase();
if (!q) { render(all, ''); return; }
var qAsn = q.replace(/^as\s*/, '');
var filtered = all.filter(function (h) {
return h.name.toLowerCase().indexOf(q) !== -1 || (qAsn && h.asn.indexOf(qAsn) !== -1);
});
render(filtered, input.value.trim());
}
function boot(text) {
all = parse(text);
render(all, '');
}
function showError() {
failed = true;
all = [];
tbody.textContent = '';
tbody.appendChild(stateRow('Не удалось получить список.'));
countEl.textContent = '';
}
input.addEventListener('input', applyFilter);
fetch('hosters.txt', { cache: 'no-store' })
.then(function (r) {
if (!r.ok) throw new Error('HTTP ' + r.status);
return r.text();
})
.then(function (text) { boot(text); })
.catch(function () { showError(); });
})();</script></body></html>
